<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blinklink Feed — Sandbox</title>
  <script src="https://ssr.sdk.blinklink.com/loader/loader.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      background: #fafafa;
      color: #222;
    }
    header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid #e5e5e5;
      background: #fff;
    }
    header h1 { margin: 0; font-size: 1.25rem; }
    header p { margin: 0.25rem 0 0; color: #777; font-size: 0.875rem; }
    main { max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
    .feed-slot {
      min-height: 320px;
      border: 1px dashed #ccc;
      border-radius: 8px;
      padding: 1rem;
      background: #fff;
    }
    .feed-slot:empty::before,
    .feed-slot > .slot-label {
      color: #aaa;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Blinklink Feed Sandbox</h1>
    <p>Minimal POC — Recommended Feed web integration (stream STREAM0001 / placement PLACEMENT0001)</p>
  </header>
  <main>
    <div class="feed-slot">
      <div
        hx-get="https://web.sdk.blinklink.com/web/ui/carousel"
        hx-target="this"
        hx-trigger="load"
        hx-swap="innerHTML"
        hx-vals='js:{"stream": "STREAM0001", "placement": "PLACEMENT0001", "clientId": "8df9b140-e726-48ab-8dae-d8bf129dea66", "adaptiveAi": false, "carouselMode": "hover", "miniPlayer": false, "clickStream": false, "recommendation": true}'>
      </div>
    </div>
  </main>
</body>
</html>
