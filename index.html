<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blinklink Feed — Sandbox</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      background: #fafafa;
      color: #222;
    }
    header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid #e5e5e5;
      background: #fff;
    }
    header h1 { margin: 0; font-size: 1.25rem; }
    header p { margin: 0.25rem 0 0; color: #777; font-size: 0.875rem; }
    main { max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
    h2 { font-size: 1rem; margin: 2rem 0 0.75rem; }
    .feed-slot {
      min-height: 320px;
      border: 1px dashed #ccc;
      border-radius: 8px;
      padding: 1rem;
      background: #fff;
    }
    .trigger {
      font: inherit;
      padding: 0.6rem 1.2rem;
      border: 0;
      border-radius: 999px;
      background: #222;
      color: #fff;
      cursor: pointer;
    }
    footer { max-width: 960px; margin: 2rem auto; padding: 0 1rem; color: #999; font-size: 0.8rem; }
  </style>
</head>
<body>
  <header>
    <h1>Blinklink Feed Sandbox</h1>
    <p>v5 dev — Third Wave (social) workspace, feed "Feed sandbox" (slot <code>feed-sandbox</code>)</p>
  </header>
  <main>
    <h2>Inline</h2>
    <div class="feed-slot">
      <!-- The console's one-line embed (Feed Settings › Web › Inline). -->
      <script async src="https://third-wave-social.dev.bl.watch/feeds/feed-sandbox" referrerpolicy="no-referrer-when-downgrade"></script>
    </div>

    <h2>UI trigger</h2>
    <!-- Feed Settings › Web › UI Trigger: any element with data-bl-trigger opens the feed as an overlay. -->
    <script async src="https://third-wave-social.dev.bl.watch/feeds/loader.js"></script>
    <button class="trigger" data-bl-trigger="feed-sandbox">Watch</button>
  </main>
  <footer>
    The page is on Third Wave's whitelist as <code>https://kaustubh-blinklink.github.io/blinklink-feed-sandbox/</code>.
    The old web-sdk version is at <a href="legacy.html">legacy.html</a>.
  </footer>
</body>
</html>
